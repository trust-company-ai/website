<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="100%" role="img" aria-label="Use-case tiers by consequence, from internal work with no client data through drafting, decision-adjacent, regulatory with no model, to prohibited; a named exception is drawn in amber." font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="rgba(11,15,23,0.5)"></path></marker><marker id="arrow-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M8,0 L0,4 L8,8 z" fill="rgba(11,15,23,0.5)"></path></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#9a6a0f"></path></marker><marker id="arrow-amber-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M8,0 L0,4 L8,8 z" fill="#9a6a0f"></path></marker></defs><g><rect x="6" y="6" width="628" height="114" rx="6" fill="rgba(29,63,138,0.06)" stroke="#1d3f8a" stroke-width="1.2"></rect><text x="320" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1d3f8a" letter-spacing="0.6">MORE HUMAN JUDGMENT AS CONSEQUENCE RISES</text><text x="320" y="29" text-anchor="middle" font-size="7.2" fill="rgba(11,15,23,0.6)">Route work by consequence, not by capability. The higher the stakes, the more human judgment stays in the loop.</text></g><g><rect x="18" y="34" width="112" height="66" rx="4" fill="rgba(11,15,23,0.025)" stroke="rgba(11,15,23,0.25)" stroke-width="1"></rect><text x="74" y="55" text-anchor="middle" font-size="9" font-weight="600" fill="#0b0f17">Tier 0 · Internal</text><text x="74" y="65" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">No client data</text><text x="74" y="75" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">Policies, public guidance,</text><text x="74" y="85" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">helpdesk</text></g><g><rect x="142" y="34" width="112" height="66" rx="4" fill="rgba(11,15,23,0.025)" stroke="rgba(11,15,23,0.25)" stroke-width="1"></rect><text x="198" y="55" text-anchor="middle" font-size="9" font-weight="600" fill="#0b0f17">Tier 1 · Drafting only</text><text x="198" y="65" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">Client data; output labelled</text><text x="198" y="75" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">as a draft, edited by</text><text x="198" y="85" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">a professional</text></g><g><rect x="266" y="34" width="112" height="66" rx="4" fill="rgba(11,15,23,0.055)" stroke="rgba(11,15,23,0.25)" stroke-width="1"></rect><text x="322" y="55" text-anchor="middle" font-size="9" font-weight="600" fill="#0b0f17">Tier 2 · Decision-adjacent</text><text x="322" y="65" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">One input; a named</text><text x="322" y="75" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">decision-maker records</text><text x="322" y="85" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">the reasoning</text></g><g><rect x="390" y="34" width="112" height="66" rx="4" fill="rgba(11,15,23,0.10)" stroke="rgba(11,15,23,0.25)" stroke-width="1"></rect><text x="446" y="55" text-anchor="middle" font-size="9" font-weight="600" fill="#0b0f17">Regulatory · No model</text><text x="446" y="65" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">Deterministic rules;</text><text x="446" y="75" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">automatic suspension</text><text x="446" y="85" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">on variance</text></g><g><rect x="514" y="34" width="112" height="66" rx="4" fill="rgba(11,15,23,0.10)" stroke="rgba(11,15,23,0.25)" stroke-width="1"></rect><text x="570" y="55" text-anchor="middle" font-size="9" font-weight="600" fill="#0b0f17">Prohibited, for now</text><text x="570" y="65" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">Autonomous approvals,</text><text x="570" y="75" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">unattended client contact,</text><text x="570" y="85" text-anchor="middle" font-size="7.6" fill="rgba(11,15,23,0.6)">execution</text></g><path d="M130,67 L142,67" fill="none" stroke="rgba(11,15,23,0.5)" stroke-width="1.1" marker-end="url(#arrow)"></path><path d="M254,67 L266,67" fill="none" stroke="rgba(11,15,23,0.5)" stroke-width="1.1" marker-end="url(#arrow)"></path><path d="M378,67 L390,67" fill="none" stroke="rgba(11,15,23,0.5)" stroke-width="1.1" marker-end="url(#arrow)"></path><path d="M502,67 L514,67" fill="none" stroke="rgba(11,15,23,0.5)" stroke-width="1.1" marker-end="url(#arrow)"></path><text x="18" y="114" text-anchor="start" font-size="6.8" fill="rgba(11,15,23,0.6)">← less consequence</text><text x="626" y="114" text-anchor="end" font-size="6.8" fill="rgba(11,15,23,0.6)">more consequence, more human judgment →</text><g><rect x="264" y="130" width="112" height="36" rx="4" fill="rgba(154,106,15,0.08)" stroke="#9a6a0f" stroke-width="1.2" stroke-dasharray="4 3"></rect><text x="320" y="141" text-anchor="middle" font-size="9" font-weight="600" fill="#9a6a0f">Named exception</text><text x="320" y="151" text-anchor="middle" font-size="7.6" fill="#9a6a0f">Documented, risk-accepted,</text><text x="320" y="161" text-anchor="middle" font-size="7.6" fill="#9a6a0f">drawn in amber</text></g><path d="M322,100 L322,130" fill="none" stroke="#9a6a0f" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrow-amber)"></path></svg>